<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Approval | The Open Floor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>Editor's Desk</h1>
        <p>Reviewing Pending Submissions</p>
    </header>

    <div class="container">
        <div class="admin-nav">
            <button onclick="filter('open')">Pending (<span id="count-pi">0</span>)</button>
            <button onclick="filter('resolved')">Live (<span id="count-li">0</span>)</button>
        </div>

        <div id="admin-feed" class="feed">
            <p>Authenticating...</p>
        </div>
    </div>

    <script>
        // Hardcoded credentials to match your server.js middleware[cite: 1]
        const HEADERS = {
            'Content-Type': 'application/json',
            'username': 'supieeewupieee',
            'password': '1.e4c5!2.Nf6d5'
        };

        let allIssues = [];

        async function fetchAdminData() {
            const res = await fetch('/api/admin/issues', { headers: HEADERS });
            if (!res.ok) {
                document.body.innerHTML = "<h1>Unauthorized Access</h1>";
                return;
            }
            allIssues = await res.json();
            updateCounts();
            renderQueue('open');
        }

        function updateCounts() {
            document.getElementById('count-pi').textContent = allIssues.filter(i => i.status === 'open').length;
            document.getElementById('count-li').textContent = allIssues.filter(i => i.status === 'resolved').length;
        }

        function renderQueue(status) {
            const container = document.getElementById('admin-feed');
            const items = allIssues.filter(i => i.status === status);
            
            container.innerHTML = items.map(issue => `
                <div class="queue-item">
                    <h3>${issue.title}</h3>
                    <p>${issue.description}</p>
                    <div class="admin-controls">
                        ${issue.status === 'open' ? `<button class="qbtn" onclick="updateStatus(${issue.id}, 'resolved')">Approve</button>` : ''}
                        <button class="qbtn reject" onclick="deleteIssue(${issue.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        async function updateStatus(id, status) {
            await fetch(`/api/admin/issues/${id}/status`, {
                method: 'PATCH',
                headers: HEADERS,
                body: JSON.stringify({ status })
            });
            fetchAdminData();
        }

        async function deleteIssue(id) {
            if (!confirm("Permanently delete?")) return;
            await fetch(`/api/admin/issues/${id}`, { method: 'DELETE', headers: HEADERS });
            fetchAdminData();
        }

        window.onload = fetchAdminData;
    </script>
</body>
</html>
