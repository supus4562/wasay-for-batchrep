<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Panel — Wasay For Batch Rep</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --ink: #050b14;
    --bg: #0b121a;
    --surface: #131d2b;
    --surface2: #1e2d40;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.12);
    --paper: #f1f5f9;
    --accent: #4A7694;
    --accent2: #2C4A60;
    --gold: #739bb8;
    --muted: #64748b;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  
  #login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); position: relative; overflow: hidden; }
  .login-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; padding: 48px; width: 100%; max-width: 400px; position: relative; }
  .login-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  .login-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); border: 1px solid rgba(115,155,184,0.3); padding: 4px 10px; border-radius: 2px; display: inline-block; margin-bottom: 20px; }
  .login-title { font-family: 'Bebas Neue', cursive; font-size: 40px; line-height: 1; color: var(--text); margin-bottom: 8px; }
  .login-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 32px; }
  .login-label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .login-input { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 4px; padding: 12px 16px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text); outline: none; margin-bottom: 16px; transition: border-color 0.2s; }
  .login-input:focus { border-color: var(--accent); }
  .login-btn { width: 100%; background: var(--accent); color: white; border: none; border-radius: 4px; padding: 14px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 4px; }
  .login-btn:hover { background: #3d627a; }
  .login-error { color: #f87171; font-size: 13px; margin-top: 12px; display: none; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.05em; }

  #admin-screen { display: none; min-height: 100vh; }
  .admin-topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  .admin-logo { font-family: 'Bebas Neue', cursive; font-size: 22px; letter-spacing: 0.05em; color: var(--text); }
  .admin-logo span { color: var(--accent); }
  .admin-logout { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; padding: 7px 14px; border: 1px solid var(--border2); color: var(--muted); background: none; border-radius: 3px; cursor: pointer; text-transform: uppercase; transition: all 0.15s; }
  .admin-logout:hover { border-color: var(--accent); color: var(--accent); }
  
  .admin-content { padding: 32px; max-width: 1100px; margin: 0 auto; }
  .admin-section-title { font-family: 'Bebas Neue', cursive; font-size: 32px; color: var(--text); display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  
  .admin-filters { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .af-btn { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; padding: 7px 14px; border: 1px solid var(--border2); background: transparent; color: var(--muted); border-radius: 3px; cursor: pointer; transition: all 0.15s; }
  .af-btn:hover, .af-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

  .admin-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
  .admin-card-header { padding: 20px 24px; display: flex; align-items: flex-start; gap: 16px; flex-direction: column; }
  .admin-card-main { width: 100%; }
  
  .admin-card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .admin-card-title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .admin-card-desc { font-size: 14px; color: var(--text-dim); line-height: 1.5; margin-bottom: 16px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 4px; }
  
  .admin-actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; width: 100%; background: var(--bg); padding: 12px; border-radius: 4px; border: 1px solid var(--border2); align-items: center;}
  .a-btn { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 7px 12px; border-radius: 3px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); cursor: pointer; transition: all 0.15s; }
  .a-btn:hover { background: var(--accent); border-color: var(--accent); }
  .a-btn.danger { border-color: rgba(248,113,113,0.4); color: #f87171; background: transparent; }
  .a-btn.danger:hover { background: rgba(248,113,113,0.15); }

  .vote-editor { display: flex; align-items: center; gap: 6px; margin-right: auto; }
  .ve-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .ve-input { width: 60px; background: var(--surface); border: 1px solid var(--border2); border-radius: 3px; padding: 5px 10px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); outline: none; text-align: center; }

  .edit-input { width: 100%; background: var(--bg); border: 1px solid var(--accent); border-radius: 4px; padding: 10px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text); margin-bottom: 8px; }
  .edit-textarea { width: 100%; background: var(--bg); border: 1px solid var(--accent); border-radius: 4px; padding: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); min-height: 80px; margin-bottom: 12px; }

  .admin-comments { display: none; border-top: 1px solid var(--border); background: var(--bg); }
  .admin-comments.open { display: block; }
  .admin-comment { display: flex; align-items: flex-start; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--border); }
  .admin-comment.hidden-comment { opacity: 0.45; }
  .ac-main { flex: 1; min-width: 0; }
  .ac-author { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .ac-body { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
  .ac-body-input { width: 100%; background: var(--surface); border: 1px solid var(--accent); border-radius: 3px; padding: 8px 12px; font-size: 13px; color: var(--text); margin-top: 4px; }
  
  .status-badge { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; padding: 4px 8px; border-radius: 2px; }
  .status-open { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }
  .status-resolved { background: rgba(74,118,148,0.15); color: var(--gold); border: 1px solid rgba(74,118,148,0.2); }
  
  .toast { position: fixed; bottom: 28px; right: 28px; background: var(--surface2); color: var(--text); padding: 12px 20px; border-radius: 4px; font-size: 13px; font-weight: 500; z-index: 9999; transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); border-left: 3px solid var(--gold); }
  .toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-badge">Admin Access</div>
    <div class="login-title">Wasay HQ</div>
    <label class="login-label">Username</label>
    <input class="login-input" id="login-user" type="text" autocomplete="username"/>
    <label class="login-label">Password</label>
    <input class="login-input" id="login-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error">⚠ Invalid credentials.</div>
  </div>
</div>

<div id="admin-screen">
  <div class="admin-topbar">
    <div class="admin-logo">Wasay <span>Admin</span></div>
    <button class="admin-logout" onclick="doLogout()">Logout</button>
  </div>

  <div class="admin-content">
    
    <div class="admin-section-title">Manage Categories</div>
    <div class="admin-card" style="padding: 24px; margin-bottom: 40px;">
      <div style="display:flex; gap:12px; margin-bottom:16px;">
        <input type="text" id="new-cat-name" class="login-input" style="margin:0; flex:1;" placeholder="Name (e.g. 💻 Tech)">
        <input type="text" id="new-cat-val" class="login-input" style="margin:0; flex:1;" placeholder="Value (e.g. tech)">
        <button class="login-btn" style="margin:0; width:auto;" onclick="addCategory()">Add</button>
      </div>
      <div id="admin-cat-list" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div class="admin-section-title" style="margin:0">Issues Feed</div>
      <button class="af-btn active" onclick="loadAdminIssues()">↻ Refresh</button>
    </div>

    <div class="admin-filters" id="dynamic-filters"></div>
    <div id="admin-issues-list"></div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let adminAuth = { username: '', password: '' };
let adminAllIssues = [];
let adminCategories = [];
let adminCurrentFilter = 'all';

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function doLogin() {
  const user = document.getElementById('login-user').value;
  const pass = document.getElementById('login-pass').value;
  const res = await fetch('/api/admin/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: user, password: pass })
  });
  if (res.ok) {
    adminAuth = { username: user, password: pass };
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    await loadAdminCategories();
    loadAdminIssues();
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
}

function doLogout() { location.reload(); }
function authHeaders() { return { 'Content-Type': 'application/json', 'username': adminAuth.username, 'password': adminAuth.password }; }

// --- Categories ---
async function loadAdminCategories() {
  const res = await fetch('/api/categories');
  adminCategories = await res.json();
  
  const filterBar = document.getElementById('dynamic-filters');
  filterBar.innerHTML = `<button class="af-btn active" onclick="adminFilter(this,'all')">All</button>`;
  adminCategories.forEach(cat => {
    filterBar.innerHTML += `<button class="af-btn" onclick="adminFilter(this,'${escHtml(cat.value)}')">${escHtml(cat.name)}</button>`;
  });

  const list = document.getElementById('admin-cat-list');
  list.innerHTML = '';
  adminCategories.forEach(cat => {
    list.innerHTML += `<div style="background:var(--surface2); padding:6px 12px; border-radius:4px; font-size:13px; display:flex; gap:8px;">
      <span>${escHtml(cat.name)}</span>
      <button style="color:#f87171; background:none; border:none; cursor:pointer" onclick="deleteCategory('${escHtml(cat.value)}')">✕</button>
    </div>`;
  });
}

async function addCategory() {
  const name = document.getElementById('new-cat-name').value;
  const value = document.getElementById('new-cat-val').value;
  await fetch('/api/admin/categories', { method: 'POST', headers: authHeaders(), body: JSON.stringify({ name, value }) });
  loadAdminCategories();
}

async function deleteCategory(val) {
  if (!confirm('Delete category?')) return;
  await fetch('/api/admin/categories/' + val, { method: 'DELETE', headers: authHeaders() });
  loadAdminCategories();
}

// --- Issues ---
async function loadAdminIssues() {
  const res = await fetch('/api/admin/issues', { headers: authHeaders() });
  adminAllIssues = await res.json();
  renderAdminIssues();
}

function adminFilter(btn, filter) {
  document.querySelectorAll('.admin-filters .af-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  adminCurrentFilter = filter;
  renderAdminIssues();
}

function renderAdminIssues() {
  const list = document.getElementById('admin-issues-list');
  let filtered = adminCurrentFilter === 'all' ? adminAllIssues : adminAllIssues.filter(i => i.category === adminCurrentFilter);
  list.innerHTML = '';

  filtered.forEach(issue => {
    const card = document.createElement('div');
    card.className = 'admin-card';
    
    // Build category options for edit mode
    let catOptions = adminCategories.map(c => `<option value="${escHtml(c.value)}" ${c.value === issue.category ? 'selected' : ''}>${escHtml(c.name)}</option>`).join('');

    card.innerHTML = `
      <div class="admin-card-header">
        <div class="admin-card-main" id="display-mode-${issue.id}">
          <div class="admin-card-meta">
            <span class="status-badge status-${issue.status}">${issue.status}</span>
            <span style="color:var(--muted); font-size:12px; font-family:monospace">${escHtml(issue.category)}</span>
          </div>
          <div class="admin-card-title">${escHtml(issue.title)}</div>
          <div class="admin-card-desc">${escHtml(issue.description)}</div>
        </div>

        <div class="admin-card-main" id="edit-mode-${issue.id}" style="display:none;">
          <input type="text" id="edit-title-${issue.id}" class="edit-input" value="${escHtml(issue.title)}">
          <select id="edit-cat-${issue.id}" class="edit-input">${catOptions}</select>
          <textarea id="edit-desc-${issue.id}" class="edit-textarea">${escHtml(issue.description)}</textarea>
          <div style="display:flex; gap:8px;">
            <button class="a-btn" style="background:var(--accent)" onclick="saveIssueData(${issue.id})">Save Changes</button>
            <button class="a-btn" onclick="toggleEditIssue(${issue.id})">Cancel</button>
          </div>
        </div>
        
        <div class="admin-actions">
          <div class="vote-editor">
            <span class="ve-label">▲</span>
            <input class="ve-input" id="up-${issue.id}" type="number" value="${issue.upvotes}"/>
            <span class="ve-label" style="margin-left:8px">▼</span>
            <input class="ve-input" id="dn-${issue.id}" type="number" value="${issue.downvotes}"/>
            <button class="a-btn" style="margin-left:8px" onclick="saveVotes(${issue.id})">Set Votes</button>
          </div>
          
          <button class="a-btn" onclick="toggleEditIssue(${issue.id})">✎ Edit Text</button>
          ${issue.status === 'open' ? `<button class="a-btn" onclick="setStatus(${issue.id},'resolved')">✓ Resolve</button>` : `<button class="a-btn" onclick="setStatus(${issue.id},'open')">↺ Reopen</button>`}
          <button class="a-btn" onclick="toggleComments(${issue.id})">💬 Comments (${issue.comment_count})</button>
          <button class="a-btn danger" onclick="deleteIssue(${issue.id})">✕ Delete Issue</button>
        </div>
      </div>
      <div class="admin-comments" id="ac-${issue.id}"></div>
    `;
    list.appendChild(card);
  });
}

function toggleEditIssue(id) {
  const display = document.getElementById(`display-mode-${id}`);
  const edit = document.getElementById(`edit-mode-${id}`);
  if (display.style.display === 'none') {
    display.style.display = 'block';
    edit.style.display = 'none';
  } else {
    display.style.display = 'none';
    edit.style.display = 'block';
  }
}

async function saveIssueData(id) {
  const title = document.getElementById(`edit-title-${id}`).value;
  const description = document.getElementById(`edit-desc-${id}`).value;
  const category = document.getElementById(`edit-cat-${id}`).value;
  
  await fetch(`/api/admin/issues/${id}`, {
    method: 'PATCH', headers: authHeaders(), body: JSON.stringify({ title, description, category })
  });
  showToast('✓ Issue updated');
  loadAdminIssues();
}

async function saveVotes(id) {
  const up = parseInt(document.getElementById('up-' + id).value);
  const dn = parseInt(document.getElementById('dn-' + id).value);
  await fetch(`/api/admin/issues/${id}/votes`, { method: 'PATCH', headers: authHeaders(), body: JSON.stringify({ upvotes: up, downvotes: dn }) });
  showToast('✓ Votes updated');
}

async function setStatus(id, status) {
  await fetch(`/api/admin/issues/${id}/status`, { method: 'PATCH', headers: authHeaders(), body: JSON.stringify({ status }) });
  loadAdminIssues();
}

async function deleteIssue(id) {
  if (!confirm('Permanently delete this issue and comments?')) return;
  await fetch(`/api/admin/issues/${id}`, { method: 'DELETE', headers: authHeaders() });
  loadAdminIssues();
}

// --- Comments ---
async function toggleComments(issueId) {
  const section = document.getElementById('ac-' + issueId);
  if (section.classList.contains('open')) { section.classList.remove('open'); return; }
  section.classList.add('open');
  loadAdminComments(issueId);
}

async function loadAdminComments(issueId) {
  const res = await fetch(`/api/admin/issues/${issueId}/comments`, { headers: authHeaders() });
  const comments = await res.json();
  const section = document.getElementById('ac-' + issueId);
  section.innerHTML = '';
  
  if(comments.length === 0) { section.innerHTML = '<div style="padding:16px; color:var(--muted)">No comments.</div>'; return; }

  comments.forEach(c => {
    const div = document.createElement('div');
    div.className = 'admin-comment' + (c.hidden ? ' hidden-comment' : '');
    div.innerHTML = `
      <div class="ac-main">
        <div class="ac-author">${escHtml(c.author)}</div>
        <div id="cb-text-${c.id}" class="ac-body">${escHtml(c.body)}</div>
        <input type="text" id="cb-input-${c.id}" class="ac-body-input" value="${escHtml(c.body)}" style="display:none">
        
        <div style="display:flex; gap:8px; margin-top:8px">
          <button class="a-btn" id="edit-btn-${c.id}" onclick="startEditComment(${c.id})">Edit</button>
          <button class="a-btn" id="save-btn-${c.id}" style="display:none; background:var(--accent)" onclick="saveComment(${c.id}, ${issueId})">Save</button>
          <button class="a-btn" onclick="toggleHideComment(${c.id}, ${issueId}, ${c.hidden})">${c.hidden ? 'Show' : 'Hide'}</button>
          <button class="a-btn danger" onclick="deleteComment(${c.id}, ${issueId})">Delete</button>
        </div>
      </div>
    `;
    section.appendChild(div);
  });
}

function startEditComment(id) {
  document.getElementById('cb-text-' + id).style.display = 'none';
  document.getElementById('cb-input-' + id).style.display = 'block';
  document.getElementById('edit-btn-' + id).style.display = 'none';
  document.getElementById('save-btn-' + id).style.display = 'block';
}

async function saveComment(id, issueId) {
  const body = document.getElementById('cb-input-' + id).value;
  await fetch(`/api/admin/comments/${id}`, { method: 'PATCH', headers: authHeaders(), body: JSON.stringify({ body }) });
  loadAdminComments(issueId);
}

async function toggleHideComment(id, issueId, currentHidden) {
  await fetch(`/api/admin/comments/${id}/visibility`, { method: 'PATCH', headers: authHeaders(), body: JSON.stringify({ hidden: !currentHidden }) });
  loadAdminComments(issueId);
}

async function deleteComment(id, issueId) {
  if (!confirm('Delete comment?')) return;
  await fetch(`/api/admin/comments/${id}`, { method: 'DELETE', headers: authHeaders() });
  loadAdminComments(issueId);
}
</script>
</body>
</html>
