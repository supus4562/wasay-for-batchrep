<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Open Floor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1>The Open Floor</h1>
            <p>Community-led transparency and change.</p>
        </div>
    </header>

    <div class="main-layout">
        <!-- New Sidebar Design -->
        <aside class="sidebar">
            <div class="sidebar-box">
                <h3>Explore</h3>
                <nav class="cat-nav" id="category-list">
                    <!-- Live categories injected here[cite: 2] -->
                </nav>
            </div>
        </aside>

        <!-- New Feed Design -->
        <main class="feed-container">
            <div class="feed-header">
                <h2>Active Issues</h2>
                <div class="stats" id="issue-stats">Loading...</div>
            </div>
            
            <div id="q-li" class="issue-list">
                <!-- Live issues injected here -->
            </div>
        </main>
    </div>

    <script>
        const votedIssues = new Set(JSON.parse(localStorage.getItem('votedIssues') || '[]'));

        function getFingerprint() {
            let fp = localStorage.getItem('deviceFingerprint');
            if (!fp) {
                fp = 'fp-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
                localStorage.setItem('deviceFingerprint', fp);
            }
            return fp;
        }

        async function init() {
            try {
                const [catRes, issueRes] = await Promise.all([
                    fetch('/api/categories'),
                    fetch('/api/issues')
                ]);
                const categories = await catRes.json();
                const issues = await issueRes.json();

                // Update Categories[cite: 2]
                document.getElementById('category-list').innerHTML = categories.map(c => 
                    `<button class="cat-item">${c.name}</button>`
                ).join('');

                // Update Stats
                document.getElementById('issue-stats').textContent = `${issues.length} Issues Live`;

                // Update Feed
                const list = document.getElementById('q-li');
                if (issues.length === 0) {
                    list.innerHTML = `<div class="empty">No approved issues yet. Check back soon!</div>`;
                    return;
                }

                list.innerHTML = issues.map(issue => {
                    const score = (issue.upvotes || 0) - (issue.downvotes || 0);
                    const hasVoted = votedIssues.has(issue.id);
                    return `
                        <div class="card">
                            <div class="card-meta">
                                <span class="badge">${issue.category}</span>
                                <span>${new Date(issue.created_at).toLocaleDateString()}</span>
                            </div>
                            <h3 class="card-title">${issue.title}</h3>
                            <p class="card-desc">${issue.description}</p>
                            <div class="card-footer">
                                <div class="vote-controls">
                                    <button class="v-btn up" onclick="vote(${issue.id}, 'up')" ${hasVoted ? 'disabled' : ''}>▲</button>
                                    <span class="v-score" id="score-${issue.id}">${score}</span>
                                    <button class="v-btn down" onclick="vote(${issue.id}, 'down')" ${hasVoted ? 'disabled' : ''}>▼</button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error("Connection failed", e);
            }
        }

        async function vote(id, type) {
            const res = await fetch(`/api/issues/${id}/vote`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, fingerprint: getFingerprint() })
            });
            if (res.ok) {
                const data = await res.json();
                votedIssues.add(id);
                localStorage.setItem('votedIssues', JSON.stringify([...votedIssues]));
                document.getElementById(`score-${id}`).textContent = data.upvotes - data.downvotes;
                init(); // Refresh to disable buttons
            }
        }

        window.onload = init;
    </script>
</body>
</html>
