<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Open Floor | Community Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>The Open Floor</h1>
        <p>Live Community Issues</p>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h3>Categories</h3>
            <nav id="category-list">
                <!-- Categories from Postgres will appear here -->
            </nav>
        </aside>

        <main class="content">
            <div id="q-li" class="feed">
                <p>Connecting to database...</p>
            </div>
        </main>
    </div>

    <script>
        // Use the same fingerprint logic to match your backend's voting rules[cite: 2]
        function getFingerprint() {
            let fp = localStorage.getItem('deviceFingerprint');
            if (!fp) {
                fp = 'fp-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
                localStorage.setItem('deviceFingerprint', fp);
            }
            return fp;
        }

        const votedIssues = new Set(JSON.parse(localStorage.getItem('votedIssues') || '[]'));

        async function loadData() {
            try {
                const [catRes, issueRes] = await Promise.all([
                    fetch('/api/categories'),
                    fetch('/api/issues') // This route only returns 'resolved' or 'open' issues
                ]);
                
                const categories = await catRes.json();
                const issues = await issueRes.json();

                // Render Categories
                document.getElementById('category-list').innerHTML = categories.map(c => 
                    `<button class="filter-btn">${c.name}</button>`
                ).join('');

                // Render Issues
                const feed = document.getElementById('q-li');
                if (issues.length === 0) {
                    feed.innerHTML = '<p>No issues found.</p>';
                    return;
                }

                feed.innerHTML = issues.map(issue => {
                    const hasVoted = votedIssues.has(issue.id);
                    const score = (issue.upvotes || 0) - (issue.downvotes || 0);
                    return `
                        <article class="queue-item">
                            <div class="queue-meta">
                                <span class="cat">${issue.category}</span>
                                <span>${new Date(issue.created_at).toLocaleDateString()}</span>
                            </div>
                            <h3>${issue.title}</h3>
                            <p>${issue.description}</p>
                            <div class="queue-actions">
                                <button class="qbtn" onclick="vote(${issue.id}, 'up')" ${hasVoted ? 'disabled' : ''}>Upvote</button>
                                <span class="score" id="score-${issue.id}">${score}</span>
                                <button class="qbtn reject" onclick="vote(${issue.id}, 'down')" ${hasVoted ? 'disabled' : ''}>Downvote</button>
                            </div>
                        </article>
                    `;
                }).join('');
            } catch (err) {
                console.error("Database connection failed:", err);
            }
        }

        async function vote(id, type) {
            const res = await fetch(`/api/issues/${id}/vote`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, fingerprint: getFingerprint() })
            });
            if (res.ok) {
                const data = await res.json();
                votedIssues.add(id);
                localStorage.setItem('votedIssues', JSON.stringify([...votedIssues]));
                document.getElementById(`score-${id}`).textContent = data.upvotes - data.downvotes;
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
